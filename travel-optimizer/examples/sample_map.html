<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Beijing itinerary (balanced)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  .legend { position: absolute; top: 10px; right: 10px; background: white; padding: 8px 12px;
             font-family: sans-serif; font-size: 13px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); z-index: 1000; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <div><b>Beijing itinerary (balanced)</b></div>
  <div style="color:#999999">&#9679; rejected</div>
  <div style="color:#0aa1a1">&#9679; backup</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([39.9423, 116.38514545454545], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const data = {"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.3972, 39.9163]}, "properties": {"name": "故宫", "day_index": 0, "stop_order": 0, "category": "museum", "priority": "must_visit", "is_meal": false, "arrival": "09:12", "departure": "12:54", "color": "#e6194b", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.404, 39.937]}, "properties": {"name": "文宇奶酪店", "day_index": 0, "stop_order": 1, "category": "cafe", "priority": "candidate_restaurant", "is_meal": true, "arrival": "13:10", "departure": "14:28", "color": "#e6194b", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.3971, 39.9279]}, "properties": {"name": "景山公园", "day_index": 0, "stop_order": 2, "category": "landmark", "priority": "high_priority", "is_meal": false, "arrival": "14:40", "departure": "15:49", "color": "#e6194b", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[116.3972, 39.9163], [116.404, 39.937], [116.3971, 39.9279]]}, "properties": {"day_index": 0, "color": "#e6194b", "layer": "route"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.498, 39.9843]}, "properties": {"name": "798艺术区", "day_index": 1, "stop_order": 0, "category": "old_street", "priority": "optional", "is_meal": false, "arrival": "09:48", "departure": "12:06", "color": "#3cb44b", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.279, 39.997]}, "properties": {"name": "颐和园附近餐厅", "day_index": 2, "stop_order": 0, "category": "restaurant", "priority": "candidate_restaurant", "is_meal": true, "arrival": "10:16", "departure": "11:42", "color": "#4363d8", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.2755, 39.9998]}, "properties": {"name": "颐和园", "day_index": 2, "stop_order": 1, "category": "park", "priority": "must_visit", "is_meal": false, "arrival": "11:51", "departure": "17:01", "color": "#4363d8", "layer": "itinerary"}}, {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[116.279, 39.997], [116.2755, 39.9998]]}, "properties": {"day_index": 2, "color": "#4363d8", "layer": "route"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.4032, 39.9366]}, "properties": {"name": "南锣鼓巷", "layer": "rejected", "reason": "Day schedule is already full; keeping '南锣鼓巷' would force removal of higher-priority stops or exceed the schedule buffer.", "color": "#999999"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.39, 39.9257]}, "properties": {"name": "北海公园", "layer": "rejected", "reason": "Day schedule is already full; keeping '北海公园' would force removal of higher-priority stops or exceed the schedule buffer.", "color": "#999999"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.4066, 39.8822]}, "properties": {"name": "天坛", "layer": "rejected", "reason": "Day schedule is already full; keeping '天坛' would force removal of higher-priority stops or exceed the schedule buffer.", "color": "#999999"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.401, 39.9175]}, "properties": {"name": "四季民福烤鸭店(故宫店)", "layer": "rejected", "reason": "四季民福烤鸭店(故宫店) closes at 14:00; even an early arrival plus 101min dining and a 20min safety buffer does not fit before closing given this day's route.", "color": "#999999"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [116.385, 39.941]}, "properties": {"name": "烤肉季(什刹海店)", "layer": "backup", "color": "#0aa1a1"}}]};
  L.geoJSON(data, {
    pointToLayer: function (feature, latlng) {
      const color = feature.properties.color || '#3388ff';
      return L.circleMarker(latlng, { radius: 7, color: color, fillColor: color, fillOpacity: 0.85 });
    },
    style: function (feature) {
      return { color: feature.properties.color || '#3388ff', weight: 3 };
    },
    onEachFeature: function (feature, layer) {
      const p = feature.properties;
      const label = p.name ? `<b>${p.name}</b>` : '';
      const extra = p.arrival ? `<br>${p.arrival}-${p.departure}` : '';
      const reason = p.reason ? `<br><i>${p.reason}</i>` : '';
      layer.bindPopup(label + extra + reason);
    }
  }).addTo(map);
</script>
</body>
</html>
